                function setIframeSize(w, h) {
                  const currentContainerRadio = w / h
                  let widthValue = w
                  let heightValue = h
                  let zoom = 1
                  if (currentContainerRadio > resolutionRatio) {
                    widthValue = h * resolutionRatio
                    heightValue = h
                  } else {
                    widthValue = w
                    heightValue = w / resolutionRatio
                  }
                  zoom = width ? widthValue / width : 1
                  return {
                    width: widthValue / zoom + 'px',
                    height: heightValue / zoom + 'px',
                    zoom,
                  }
                }
                function adjustIframeSize() {
                  const iframeWrapper = document.querySelector(".iframe-wrapper")
                  const { width, height, zoom } = setIframeSize(window.innerWidth, window.innerHeight)
                  iframeWrapper.style.height = height
                  iframeWrapper.style.width = width
                  iframeWrapper.style.transform = 'scale(' + zoom + ')'
                }
                function sanitizeFilename(name) {
                  return name.replace(/[\/:*?"<>|]/g, '_')
                }
                function handlePostMessage(event) {
                  if (!event.data) {
                    return
                  }
                  const { type, targetPageId } = event.data
                  const targetPageName = pageNameMap[targetPageId]
                  if (type === "iframeNavigation" && targetPageId && targetPageName) {
                    window.location.href = targetPageName + '.html'
                  }
                }
                window.addEventListener('message', handlePostMessage)
                window.onload = adjustIframeSize
                window.onresize = adjustIframeSize
                window.onunload = () => {
                  window.removeEventListener('message', handlePostMessage)
                }

<script>
(function() {
    // Navbar specific functionality
    const navbar = document.querySelector(&#39;[data-section-id="navbar_web"]&#39;);

    // Close mobile menu when clicking outside
    document.addEventListener(&#39;click&#39;, function(event) {
        const mobileMenu = document.getElementById(&#39;mobile-menu&#39;);
        const menuToggle = navbar.querySelector(&#39;.btn-circle&#39;);
        
        if (mobileMenu &amp;&amp; !mobileMenu.contains(event.target) &amp;&amp; !menuToggle.contains(event.target)) {
            mobileMenu.classList.add(&#39;hidden&#39;);
        }
    });

    // Update active navigation state
    window.setActiveNavigation = function(pageId) {
        const navLinks = navbar.querySelectorAll(&#39;.menu a&#39;);
        navLinks.forEach(link => {
            link.classList.remove(&#39;text-primary&#39;, &#39;font-semibold&#39;);
        });

        // Map pageId to navigation items
        const navMap = {
            &#39;temples_list_page&#39;: &#39;Chùa&#39;,
            &#39;temple_detail_page&#39;: &#39;Chùa&#39;,
            &#39;temples_map_view_page&#39;: &#39;Chùa&#39;,

            &#39;charity_list_page&#39;: &#39;Từ thiện&#39;,
            &#39;charity_detail_page&#39;: &#39;Từ thiện&#39;
        };

        if (navMap[pageId]) {
            const activeLink = Array.from(navLinks).find(link => 
                link.textContent.trim() === navMap[pageId]
            );
            if (activeLink) {
                activeLink.classList.add(&#39;text-primary&#39;, &#39;font-semibold&#39;);
            }
        }
    };
})();

(function() {

        const breadcrumbList = document.getElementById(&#39;breadcrumb-list&#39;);
        if (!breadcrumbList || !Array.isArray(breadcrumbItems)) return;

        breadcrumbList.innerHTML = &#39;&#39;;

        breadcrumbItems.forEach((item, index) => {
            const li = document.createElement(&#39;li&#39;);
            
            if (index === breadcrumbItems.length - 1) {
                // Last item - current page (no link)
                const span = document.createElement(&#39;span&#39;);

                if (item.icon) {
                    const iconSpan = document.createElement(&#39;span&#39;);

                    iconSpan.setAttribute(&#39;data-icon&#39;, item.icon);
                    iconSpan.setAttribute(&#39;data-width&#39;, &#39;16&#39;);
                    span.appendChild(iconSpan);
                }
                
                const textNode = document.createTextNode(item.text);
                span.appendChild(textNode);
                li.appendChild(span);
            } else {
                // Previous items - clickable links
                const a = document.createElement(&#39;a&#39;);
                a.className = &#39;flex items-center gap-1 cursor-pointer&#39;;
                
                if (item.pageId) {

    function updateAll(amount) {
        amountInput.value = amount;
        amountSlider.value = amount;

        amountButtons.forEach(btn => {
            // Use includes to match text content like "50.000₫" with amount 50000
            const btnAmount = parseInt(btn.textContent.replace(/[.,₫]/g, &#39;&#39;));
            if (btnAmount === amount) {
                btn.classList.add(&#39;active&#39;, &#39;btn-primary&#39;);
                btn.classList.remove(&#39;btn-outline&#39;);
            } else {
                btn.classList.remove(&#39;active&#39;, &#39;btn-primary&#39;);
                btn.classList.add(&#39;btn-outline&#39;);
            }
        });
    }

    function selectAmount(amount) {
        updateAll(amount);
    }

    function updateFromInput() {
        const value = parseInt(amountInput.value) || 0;
        updateAll(value);
    }

    function updateFromSlider() {
        const value = parseInt(amountSlider.value);
        updateAll(value);
