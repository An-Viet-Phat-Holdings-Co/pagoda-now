                function setIframeSize(w, h) {
                  const currentContainerRadio = w / h
                  let widthValue = w
                  let heightValue = h
                  let zoom = 1
                  if (currentContainerRadio > resolutionRatio) {
                    widthValue = h * resolutionRatio
                    heightValue = h
                  } else {
                    widthValue = w
                    heightValue = w / resolutionRatio
                  }
                  zoom = width ? widthValue / width : 1
                  return {
                    width: widthValue / zoom + 'px',
                    height: heightValue / zoom + 'px',
                    zoom,
                  }

                function adjustIframeSize() {
                  const iframeWrapper = document.querySelector(".iframe-wrapper")
                  const { width, height, zoom } = setIframeSize(window.innerWidth, window.innerHeight)

                  iframeWrapper.style.width = width

                  }

(function() {

            mobileMenu.classList.add(&#39;hidden&#39;);
        }
    });

    // Update active navigation state
    window.setActiveNavigation = function(pageId) {
        const navLinks = navbar.querySelectorAll(&#39;.menu a&#39;);
        navLinks.forEach(link => {
            link.classList.remove(&#39;text-primary&#39;, &#39;font-semibold&#39;);

            &#39;charity_detail_page&#39;: &#39;Từ thiện&#39;
        };

        if (navMap[pageId]) {
            const activeLink = Array.from(navLinks).find(link => 
                link.textContent.trim() === navMap[pageId]
            );
            if (activeLink) {
                activeLink.classList.add(&#39;text-primary&#39;, &#39;font-semibold&#39;);

                            <li data-repeatable="true">Dịch vụ được cung cấp "nguyên trạng" mà không có bất kỳ bảo đảm nào.</li>
                        </ul>
                    </div>

                    <article class="prose max-w-none prose-h2:font-semibold prose-h2:text-2xl prose-h2:mb-4 prose-h3:font-semibold prose-h3:text-xl prose-h3:mt-8 prose-h3:mb-3 prose-a:text-primary hover:prose-a:underline">
                        <section id="introduction">
                            <h2>1. Giới thiệu</h2>
                            <p>Chào mừng bạn đến với Pagoda. Bằng cách truy cập hoặc sử dụng ứng dụng của chúng tôi, bạn đồng ý bị ràng buộc bởi các Điều khoản Dịch vụ ("Điều khoản") này. Nếu bạn không đồng ý với bất kỳ phần nào của điều khoản, bạn không được phép truy cập Dịch vụ.</p>
                        </section>
                        
                        <section id="user-accounts">
                            <h2>2. Tài khoản người dùng</h2>
                            <p>Khi bạn tạo một tài khoản với chúng tôi, bạn phải cung cấp cho chúng tôi thông tin chính xác, đầy đủ và cập nhật tại mọi thời điểm. Việc không làm như vậy cấu thành một hành vi vi phạm Điều khoản, có thể dẫn đến việc chấm dứt ngay lập tức tài khoản của bạn trên Dịch vụ của chúng tôi.</p>
                            <div role="alert" class="alert alert-info my-6">
                              <span class="iconify" data-icon="heroicons:exclamation-triangle-solid" data-width="24"></span>
                              <div>
                                <h3 class="font-bold">Bảo mật mật khẩu!</h3>
                                <div class="text-sm">Bạn chịu trách nhiệm bảo vệ mật khẩu mà bạn sử dụng để truy cập Dịch vụ và cho bất kỳ hoạt động hoặc hành động nào dưới mật khẩu của bạn.</div>
                              </div>
                            </div>
                            <p>Bạn đồng ý không tiết lộ mật khẩu của mình cho bất kỳ bên thứ ba nào. Bạn phải thông báo cho chúng tôi ngay lập tức khi nhận thấy bất kỳ vi phạm bảo mật hoặc sử dụng trái phép tài khoản của bạn.</p>
                        </section>

                        <section id="content">
                            <h2>3. Nội dung</h2>
                            <p>Dịch vụ của chúng tôi cho phép bạn đăng, liên kết, lưu trữ, chia sẻ và cung cấp một số thông tin, văn bản, đồ họa, video hoặc tài liệu khác ("Nội dung"). Bạn chịu trách nhiệm về Nội dung mà bạn đăng lên Dịch vụ, bao gồm cả tính hợp pháp, độ tin cậy và sự phù hợp của nó.</p>
                            <p>Bằng cách đăng Nội dung lên Dịch vụ, bạn cấp cho chúng tôi quyền và giấy phép sử dụng, sửa đổi, thực hiện công khai, hiển thị công khai, sao chép và phân phối Nội dung đó trên và thông qua Dịch vụ. Bạn giữ lại bất kỳ và tất cả các quyền của bạn đối với bất kỳ Nội dung nào bạn gửi, đăng hoặc hiển thị trên hoặc thông qua Dịch vụ và bạn chịu trách nhiệm bảo vệ các quyền đó.</p>
                        </section>

                        <section id="prohibited-uses">
                            <h2>4. Các hành vi bị cấm</h2>
                             <p>Bạn đồng ý không sử dụng Dịch vụ:</p>
                             <ul class="list-disc list-inside space-y-2">
                                <li data-repeatable="true">Theo bất kỳ cách nào vi phạm bất kỳ luật hoặc quy định hiện hành nào của quốc gia hoặc quốc tế.</li>
                                <li data-repeatable="true">Với mục đích khai thác, làm hại hoặc cố gắng khai thác hoặc làm hại trẻ vị thành niên theo bất kỳ cách nào bằng cách cho họ tiếp xúc với nội dung không phù hợp hoặc cách khác.</li>
                                <li data-repeatable="true">Mạo danh hoặc cố gắng mạo danh Công ty, nhân viên Công ty, người dùng khác hoặc bất kỳ cá nhân hoặc tổ chức nào khác.</li>
                             </ul>
                        </section>

                        <section id="termination">
                            <h2>5. Chấm dứt</h2>
                            <p>Chúng tôi có thể chấm dứt hoặc tạm ngưng tài khoản của bạn ngay lập tức, mà không cần thông báo trước hoặc chịu trách nhiệm pháp lý, vì bất kỳ lý do nào, bao gồm nhưng không giới hạn nếu bạn vi phạm Điều khoản.</p>
                            <p>Khi chấm dứt, quyền sử dụng Dịch vụ của bạn sẽ ngay lập tức chấm dứt. Nếu bạn muốn chấm dứt tài khoản của mình, bạn có thể chỉ cần ngừng sử dụng Dịch vụ.</p>
                        </section>

                        <section id="governing-law">
                            <h2>6. Luật điều chỉnh</h2>
                            <p>Các Điều khoản này sẽ được điều chỉnh và hiểu theo luật pháp của Việt Nam, không liên quan đến các quy định về xung đột pháp luật của nó.</p>
                        </section>

                        <section id="changes">
                            <h2>7. Thay đổi Điều khoản</h2>
                            <p>Chúng tôi có quyền, theo quyết định riêng của mình, sửa đổi hoặc thay thế các Điều khoản này bất kỳ lúc nào. Nếu một bản sửa đổi là quan trọng, chúng tôi sẽ cố gắng cung cấp thông báo ít nhất 30 ngày trước khi bất kỳ điều khoản mới nào có hiệu lực. Điều gì tạo thành một thay đổi quan trọng sẽ được xác định theo quyết định riêng của chúng tôi.</p>
                        </section>

                        <section id="contact-us">
                            <h2>8. Liên hệ chúng tôi</h2>
                            <p>Nếu bạn có bất kỳ câu hỏi nào về các Điều khoản này, vui lòng liên hệ với chúng tôi qua email tại <a href="mailto:support@pagoda.app" class="link">support@pagoda.app</a>.</p>
                        </section>

    if (window.setActiveNavigation) {
        setActiveNavigation(&#39;terms_of_service_page&#39;);
    }

    const backToTopButton = document.getElementById(&#39;back-to-top&#39;);
    if (backToTopButton) {
        window.addEventListener(&#39;scroll&#39;, () => {
            if (window.scrollY > 400) {
                backToTopButton.classList.add(&#39;show&#39;);
                backToTopButton.classList.remove(&#39;hidden&#39;);
            } else {
                backToTopButton.classList.remove(&#39;show&#39;);
                 setTimeout(() => {
                    if (window.scrollY <= 400) {
                       backToTopButton.classList.add(&#39;hidden&#39;);
                    }
                }, 300);
            }
        });

        backToTopButton.addEventListener(&#39;click&#39;, () => {
            window.scrollTo({ top: 0, behavior: &#39;smooth&#39; });
        });
    }

    // Table of Contents active link highlighting on scroll
    const tocLinks = document.querySelectorAll(&#39;aside nav a&#39;);
    const sections = Array.from(document.querySelectorAll(&#39;article section&#39;));
    
    if (tocLinks.length > 0 &amp;&amp; sections.length > 0) {
        const observerOptions = {
          root: null,
          rootMargin: &#39;0px 0px -75% 0px&#39;,
          threshold: 0
        };

        const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.getAttribute(&#39;id&#39;);
                    tocLinks.forEach(link => {
                        link.classList.remove(&#39;toc-active&#39;);
                        if (link.getAttribute(&#39;href&#39;) === `#${id}`) {
                            link.classList.add(&#39;toc-active&#39;);
                        }
                    });
                }
            });
        }, observerOptions);

        sections.forEach(section => {
            sectionObserver.observe(section);
        });
    }
});
</script>
