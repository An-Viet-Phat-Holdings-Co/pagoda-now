                    heightValue = h

    }
    
    // Show loading state
    const submitButton = form.querySelector(&#39;button[type="submit"]&#39;);
    submitButton.classList.add(&#39;loading&#39;);
    submitButton.disabled = true;
    
    // Simulate login process
    setTimeout(() => {
        // Reset button state
        submitButton.classList.remove(&#39;loading&#39;);
        submitButton.disabled = false;
        
        // Mock authentication - in real app, this would be an API call
        if (username &amp;&amp; password) {
            // Show success message
            window.PagodaUtils.showToast(&#39;Đăng nhập thành công!&#39;, &#39;success&#39;);
            
            // Store user session (mock)
            localStorage.setItem(&#39;pagoda_user&#39;, JSON.stringify({
                username: username,
                loginTime: new Date().toISOString()
            }));
            
            // Navigate to home page
            setTimeout(() => {
                navigateTo(&#39;home_page&#39;);
            }, 1000);
        } else {
            showError(&#39;Tên đăng nhập hoặc mật khẩu không đúng&#39;);
        }
    }, 1500);
}

function showError(message) {
    // Remove any existing error messages
    const existingErrors = document.querySelectorAll(&#39;.error-message&#39;);
    existingErrors.forEach(error => error.remove());
    
    // Add error styling to inputs
    const inputs = document.querySelectorAll(&#39;.input&#39;);
    inputs.forEach(input => input.classList.add(&#39;error&#39;));
    
    // Create and show error message
    const errorDiv = document.createElement(&#39;div&#39;);
    errorDiv.className = &#39;error-message&#39;;
    errorDiv.innerHTML = `
        <span class="iconify" data-icon="heroicons:exclamation-circle" data-width="16"></span>
        <span>${message}</span>
    `;
    
    // Insert error message after the form
    const form = document.querySelector(&#39;form&#39;);
    form.parentNode.insertBefore(errorDiv, form.nextSibling);
    
    // Show toast notification
    window.PagodaUtils.showToast(message, &#39;error&#39;);
}

function clearErrorStates() {
    // Remove error styling from inputs
    const inputs = document.querySelectorAll(&#39;.input&#39;);
    inputs.forEach(input => input.classList.remove(&#39;error&#39;));
    
    // Remove error messages
    const errorMessages = document.querySelectorAll(&#39;.error-message&#39;);
    errorMessages.forEach(error => error.remove());
}

function showBenefitsModal() {
    const modal = document.getElementById(&#39;benefitsModal&#39;);
    if (modal) {
        modal.showModal();
    }
}

// Auto-focus on username field when page loads
document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
    const usernameInput = document.querySelector(&#39;input[name="username"]&#39;);
    if (usernameInput) {
        usernameInput.focus();
    }
    
    // Add smooth animations to form elements
    const formElements = document.querySelectorAll(&#39;.form-control&#39;);
    formElements.forEach((element, index) => {
        element.style.opacity = &#39;0&#39;;
        element.style.transform = &#39;translateY(20px)&#39;;
        
        setTimeout(() => {
            element.style.transition = &#39;all 0.5s ease-out&#39;;
            element.style.opacity = &#39;1&#39;;
            element.style.transform = &#39;translateY(0)&#39;;
        }, index * 100);
    });
});

// Handle Enter key in form fields
document.addEventListener(&#39;keydown&#39;, function(event) {
    if (event.key === &#39;Enter&#39;) {
        const activeElement = document.activeElement;
        if (activeElement &amp;&amp; activeElement.tagName === &#39;INPUT&#39;) {
            const form = activeElement.closest(&#39;form&#39;);
            if (form) {
                const submitButton = form.querySelector(&#39;button[type="submit"]&#39;);
                if (submitButton &amp;&amp; !submitButton.disabled) {
                    submitButton.click();
                }
            }
        }
    }
});

// Check if user is already logged in
function checkExistingSession() {
    const existingUser = localStorage.getItem(&#39;pagoda_user&#39;);
    if (existingUser) {
        try {
            const userData = JSON.parse(existingUser);
            const loginTime = new Date(userData.loginTime);
            const now = new Date();
            const hoursSinceLogin = (now - loginTime) / (1000 * 60 * 60);
            
            // If logged in within last 24 hours, redirect to home
            if (hoursSinceLogin < 24) {
                window.PagodaUtils.showToast(&#39;Bạn đã đăng nhập rồi!&#39;, &#39;info&#39;);
                setTimeout(() => {
                    navigateTo(&#39;home_page&#39;);
                }, 1000);
            }
        } catch (error) {
            // Invalid session data, clear it
            localStorage.removeItem(&#39;pagoda_user&#39;);
        }
    }
}

// Check session on page load
document.addEventListener(&#39;DOMContentLoaded&#39;, checkExistingSession);
