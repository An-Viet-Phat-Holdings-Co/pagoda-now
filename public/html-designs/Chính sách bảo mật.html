    const tocLinks = document.querySelectorAll(&#39;.toc-link&#39;);
    const indicator = document.querySelector(&#39;.toc-indicator&#39;);

    // Section fade-in animation observer
    const sectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add(&#39;visible&#39;);
            }
        });
    }, {
        threshold: 0.1
    });

    sections.forEach(section => {
        sectionObserver.observe(section);
    });

    // TOC active state observer
    const tocObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.getAttribute(&#39;id&#39;);
                const activeLink = document.querySelector(`.toc-link[href="#${id}"]`);

                tocLinks.forEach(link => link.classList.remove(&#39;active&#39;));
                
                if (activeLink) {
                    activeLink.classList.add(&#39;active&#39;);
                    // Update indicator position
                    if (indicator) {
                        indicator.style.top = `${activeLink.offsetTop}px`;
                        indicator.style.height = `${activeLink.offsetHeight}px`;
                    }
                }
            }
        });
    }, {
        rootMargin: "-40% 0px -60% 0px", // a thin line in the middle of the viewport
        threshold: 0
    });

    sections.forEach(section => {
        tocObserver.observe(section);
    });
    
    // Set initial active link for ToC indicator
    const firstLink = document.querySelector(&#39;.toc-link&#39;);
    if (firstLink &amp;&amp; indicator) {
        // We set it on load to the first item, the observer will correct it on scroll.
        firstLink.classList.add(&#39;active&#39;);
        indicator.style.top = `${firstLink.offsetTop}px`;
        indicator.style.height = `${firstLink.offsetHeight}px`;
    }
});
