                function setIframeSize(w, h) {
                  const currentContainerRadio = w / h
                  let widthValue = w
                  let heightValue = h
                  let zoom = 1
                  if (currentContainerRadio > resolutionRatio) {
                    widthValue = h * resolutionRatio
                    heightValue = h
                  } else {
                    widthValue = w
                    heightValue = w / resolutionRatio
                  }
                  zoom = width ? widthValue / width : 1
                  return {
                    width: widthValue / zoom + 'px',
                    height: heightValue / zoom + 'px',
                    zoom,
                  }
                }
                function adjustIframeSize() {
                  const iframeWrapper = document.querySelector(".iframe-wrapper")
                  const { width, height, zoom } = setIframeSize(window.innerWidth, window.innerHeight)
                  iframeWrapper.style.height = height
                  iframeWrapper.style.width = width
                  iframeWrapper.style.transform = 'scale(' + zoom + ')'
                }
                function sanitizeFilename(name) {

                function handlePostMessage(event) {

                  const targetPageName = pageNameMap[targetPageId]
                  if (type === "iframeNavigation" && targetPageId && targetPageName) {
                    window.location.href = targetPageName + '.html'
                  }
                }
                window.addEventListener('message', handlePostMessage)
                window.onload = adjustIframeSize
                window.onresize = adjustIframeSize
                window.onunload = () => {
                  window.removeEventListener('message', handlePostMessage)
                }

(function() {

    document.addEventListener(&#39;click&#39;, function(event) {
        const mobileMenu = document.getElementById(&#39;mobile-menu&#39;);
        const menuToggle = navbar.querySelector(&#39;.btn-circle&#39;);
        
        if (mobileMenu &amp;&amp; !mobileMenu.contains(event.target) &amp;&amp; !menuToggle.contains(event.target)) {
            mobileMenu.classList.add(&#39;hidden&#39;);
        }
    });

    // Update active navigation state
    window.setActiveNavigation = function(pageId) {
        const navLinks = navbar.querySelectorAll(&#39;.menu a&#39;);
        navLinks.forEach(link => {
            link.classList.remove(&#39;text-primary&#39;, &#39;font-semibold&#39;);
        });

        // Map pageId to navigation items
        const navMap = {
            &#39;temples_list_page&#39;: &#39;Chùa&#39;,

            &#39;charity_list_page&#39;: &#39;Từ thiện&#39;,
            &#39;charity_detail_page&#39;: &#39;Từ thiện&#39;
        };

        if (navMap[pageId]) {
            const activeLink = Array.from(navLinks).find(link =>

            if (activeLink) {

    <script>
(function() {
    // Global navigation function
    window.navigateTo = function(targetPageId) {
        const isInIframe = window.self !== window.top;
        const targetFileName = `${targetPageId}.html`;
        
        if (isInIframe) {
            window.parent.postMessage({
                type: &#39;iframeNavigation&#39;,
                targetPageId: targetPageId
            }, &#39;*&#39;);
        } else {
            window.location.href = targetFileName;
        }
    };

    // Global utility functions for Pagoda app
    window.PagodaUtils = {
        // Toggle mobile menu
        toggleMobileMenu: function() {
            const menu = document.getElementById(&#39;mobile-menu&#39;);
            if (menu) {
                menu.classList.toggle(&#39;hidden&#39;);
            }
        },

        // Handle search form submission
        handleSearch: function(form) {
            const formData = new FormData(form);
            const searchQuery = formData.get(&#39;search&#39;) || formData.get(&#39;searchQuery&#39;);
            const category = formData.get(&#39;category&#39;);
            
            if (searchQuery &amp;&amp; searchQuery.trim()) {
                // Navigate to search results with parameters
                navigateTo(&#39;search_page&#39;);
                return true;
            }
            return false; // Prevent default form submission
        },

        // Handle language selection
        handleLanguageChange: function(language) {
            console.log(&#39;Language changed to:&#39;, language);
            // Implementation for language change
            localStorage.setItem(&#39;pagoda_language&#39;, language);
        },

        // Format numbers for donations and prices
        formatCurrency: function(amount, currency = &#39;VND&#39;) {
            if (currency === &#39;VND&#39;) {
                return new Intl.NumberFormat(&#39;vi-VN&#39;, {
                    style: &#39;currency&#39;,
                    currency: &#39;VND&#39;
                }).format(amount);
            }
            return new Intl.NumberFormat(&#39;en-US&#39;, {
                style: &#39;currency&#39;,
                currency: currency
            }).format(amount);
        },

        // Format distance for temples and restaurants
        formatDistance: function(distanceKm) {
            if (distanceKm < 1) {
                return `${Math.round(distanceKm * 1000)}m`;
            }
            return `${distanceKm.toFixed(1)}km`;
        },

        // Handle notification actions
        toggleNotifications: function() {
            // Implementation for notification toggle
            console.log(&#39;Toggle notifications&#39;);
        },

        // Handle follow/unfollow temples
        toggleTempleFollow: function(templeId) {
            console.log(&#39;Toggle follow for temple:&#39;, templeId);
            // Implementation for following temples
        },

        // Show toast messages
        showToast: function(message, type = &#39;info&#39;) {
            // Create and show toast notification
            const toast = document.createElement(&#39;div&#39;);
            toast.className = `toast toast-top toast-center z-50`;
            toast.innerHTML = `
                <div class="alert alert-${type}">
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            // Auto remove after 3 seconds
            setTimeout(() => {
                if (document.body.contains(toast)) {
                    document.body.removeChild(toast);
                }
            }, 3000);
        }
    };

    // Initialize app globals
    window.APP_GLOBALS = window.APP_GLOBALS || {};
    window.APP_GLOBALS.currentUser = null;
    window.APP_GLOBALS.currentLocation = null;
    window.APP_GLOBALS.followedTemples = [];
})();
</script>
    <script>

        const followText = document.getElementById(&#39;follow-text&#39;);

        if (isFollowing) {
            followBtn.classList.remove(&#39;btn-outline&#39;);

            // PagodaUtils.showToast(&#39;Bắt đầu theo dõi Chùa Quan Sứ&#39;, &#39;success&#39;);
