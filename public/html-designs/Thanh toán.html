                function setIframeSize(w, h) {
                  const currentContainerRadio = w / h
                  let widthValue = w
                  let heightValue = h
                  let zoom = 1
                  if (currentContainerRadio > resolutionRatio) {
                    widthValue = h * resolutionRatio
                    heightValue = h
                  } else {
                    widthValue = w
                    heightValue = w / resolutionRatio
                  }
                  zoom = width ? widthValue / width : 1
                  return {
                    width: widthValue / zoom + 'px',
                    height: heightValue / zoom + 'px',
                    zoom,
                  }

                function adjustIframeSize() {
                  const iframeWrapper = document.querySelector(".iframe-wrapper")
                  const { width, height, zoom } = setIframeSize(window.innerWidth, window.innerHeight)

                  iframeWrapper.style.width = width

                  }

                window.onload = adjustIframeSize
                window.onresize = adjustIframeSize
                window.onunload = () => {
                  window.removeEventListener('message', handlePostMessage)
                }

(function() {
    // Global navigation function
    window.navigateTo = function(targetPageId) {
        const isInIframe = window.self !== window.top;
        const targetFileName = `${targetPageId}.html`;
        
        if (isInIframe) {
            window.parent.postMessage({
                type: &#39;iframeNavigation&#39;,
                targetPageId: targetPageId
            }, &#39;*&#39;);
        } else {
            window.location.href = targetFileName;
        }
    };

    // Global utility functions for Pagoda app
    window.PagodaUtils = {
        // Toggle mobile menu
        toggleMobileMenu: function() {
            const menu = document.getElementById(&#39;mobile-menu&#39;);
            if (menu) {
                menu.classList.toggle(&#39;hidden&#39;);
            }
        },

        // Handle search form submission
        handleSearch: function(form) {
            const formData = new FormData(form);
            const searchQuery = formData.get(&#39;search&#39;) || formData.get(&#39;searchQuery&#39;);
            const category = formData.get(&#39;category&#39;);
            
            if (searchQuery &amp;&amp; searchQuery.trim()) {
                // Navigate to search results with parameters
                navigateTo(&#39;search_page&#39;);
                return true;
            }
            return false; // Prevent default form submission
        },

        // Handle language selection
        handleLanguageChange: function(language) {
            console.log(&#39;Language changed to:&#39;, language);
            // Implementation for language change
            localStorage.setItem(&#39;pagoda_language&#39;, language);
        },

        // Format numbers for donations and prices
        formatCurrency: function(amount, currency = &#39;VND&#39;) {
            if (currency === &#39;VND&#39;) {
                return new Intl.NumberFormat(&#39;vi-VN&#39;, {
                    style: &#39;currency&#39;,
                    currency: &#39;VND&#39;
                }).format(amount);
            }
            return new Intl.NumberFormat(&#39;en-US&#39;, {
                style: &#39;currency&#39;,
                currency: currency
            }).format(amount);
        },

        // Format distance for temples and restaurants
        formatDistance: function(distanceKm) {
            if (distanceKm < 1) {
                return `${Math.round(distanceKm * 1000)}m`;
            }
            return `${distanceKm.toFixed(1)}km`;
        },

        toggleNotifications: function() {

        // Handle follow/unfollow temples

        },

        showToast: function(message, type = &#39;info&#39;) {
            // Create and show toast notification
            const toast = document.createElement(&#39;div&#39;);

            toast.innerHTML = `
                <div class="alert alert-${type}">
                    <span>${message}</span>

            document.body.appendChild(toast);
            
            // Auto remove after 3 seconds

    <script>
(function() {
    // Initialize page
    document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
        // Set navigation state
        if (typeof setActiveNavigation === &#39;function&#39;) {
            setActiveNavigation(&#39;checkout_page&#39;);
        }

        // Set breadcrumb
        if (typeof setBreadcrumb === &#39;function&#39; &amp;&amp; typeof BreadcrumbPatterns !== &#39;undefined&#39;) {
            setBreadcrumb(BreadcrumbPatterns.shopProductDetails(&#39;Thanh toán&#39;));
        }

        initializeCheckoutForm();
    });

    // Initialize checkout form functionality
    function initializeCheckoutForm() {
        // Address option toggle
        const addressOptions = document.querySelectorAll(&#39;input[name="address-option"]&#39;);
        const savedAddress = document.getElementById(&#39;saved-address&#39;);
        const newAddressForm = document.getElementById(&#39;new-address-form&#39;);

        addressOptions.forEach(option => {
            option.addEventListener(&#39;change&#39;, function() {
                if (this.value === &#39;saved&#39;) {
                    savedAddress.classList.remove(&#39;hidden&#39;);
                    newAddressForm.classList.add(&#39;hidden&#39;);
                } else {
                    savedAddress.classList.add(&#39;hidden&#39;);
                    newAddressForm.classList.remove(&#39;hidden&#39;);
                }
                validateForm();
            });
        });

        // Payment method toggle
        const paymentMethods = document.querySelectorAll(&#39;input[name="payment-method"]&#39;);
        const creditCardForm = document.getElementById(&#39;credit-card-form&#39;);

        paymentMethods.forEach(method => {
            method.addEventListener(&#39;change&#39;, function() {
                if (this.value === &#39;credit-card&#39;) {
                    creditCardForm.classList.remove(&#39;hidden&#39;);
                } else {
                    creditCardForm.classList.add(&#39;hidden&#39;);
                }
                validateForm();
            });
        });

        // Terms agreement checkbox
        const termsCheckbox = document.getElementById(&#39;terms-agreement&#39;);
        termsCheckbox.addEventListener(&#39;change&#39;, validateForm);

        // Form validation for all inputs
        const formInputs = document.querySelectorAll(&#39;input, select, textarea&#39;);
        formInputs.forEach(input => {
            input.addEventListener(&#39;input&#39;, validateForm);
            input.addEventListener(&#39;blur&#39;, function() {
                validateField(this);
            });
        });

        // Credit card number formatting
        const cardNumberInput = document.querySelector(&#39;input[placeholder="1234 5678 9012 3456"]&#39;);
        if (cardNumberInput) {
            cardNumberInput.addEventListener(&#39;input&#39;, function(e) {
                let value = e.target.value.replace(/\s/g, &#39;&#39;).replace(/[^0-9]/gi, &#39;&#39;);
                let formattedValue = value.match(/.{1,4}/g)?.join(&#39; &#39;) || value;
                e.target.value = formattedValue;
            });
        }

        // Expiry date formatting
        const expiryInput = document.querySelector(&#39;input[placeholder="MM/YY"]&#39;);
        if (expiryInput) {
            expiryInput.addEventListener(&#39;input&#39;, function(e) {
                let value = e.target.value.replace(/\D/g, &#39;&#39;);
                if (value.length >= 2) {
                    value = value.substring(0, 2) + &#39;/&#39; + value.substring(2, 4);
                }
                e.target.value = value;
            });
        }

        // Initial validation
        validateForm();
    }

    // Validate individual field
    function validateField(field) {
        const value = field.value.trim();
        let isValid = true;

        // Remove previous validation classes
        field.classList.remove(&#39;form-error&#39;, &#39;form-success&#39;);

        // Skip validation for optional fields
        if (!field.required &amp;&amp; !value) {
            return true;
        }

        // Email validation
        if (field.type === &#39;email&#39; &amp;&amp; value) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            isValid = emailRegex.test(value);
        }

        // Phone validation
        if (field.type === &#39;tel&#39; &amp;&amp; value) {
            const phoneRegex = /^[0-9]{10,11}$/;
            isValid = phoneRegex.test(value.replace(/\D/g, &#39;&#39;));
        }

        // Credit card validation
        if (field.placeholder === &#39;1234 5678 9012 3456&#39; &amp;&amp; value) {
            const cardNumber = value.replace(/\s/g, &#39;&#39;);
            isValid = cardNumber.length >= 13 &amp;&amp; cardNumber.length <= 19;
        }

        // CVV validation
        if (field.placeholder === &#39;123&#39; &amp;&amp; value) {
            isValid = value.length >= 3 &amp;&amp; value.length <= 4;
        }

        // Expiry date validation
        if (field.placeholder === &#39;MM/YY&#39; &amp;&amp; value) {
            const parts = value.split(&#39;/&#39;);
            if (parts.length === 2) {
                const month = parseInt(parts[0]);
                const year = parseInt(&#39;20&#39; + parts[1]);
                const currentYear = new Date().getFullYear();
                const currentMonth = new Date().getMonth() + 1;
                
                isValid = month >= 1 &amp;&amp; month <= 12 &amp;&amp; 
                         (year > currentYear || (year === currentYear &amp;&amp; month >= currentMonth));
            } else {
                isValid = false;
            }
        }

        // Required field validation
        if (field.required &amp;&amp; !value) {
            isValid = false;
        }

        // Apply validation styling
        if (value) {
            field.classList.add(isValid ? &#39;form-success&#39; : &#39;form-error&#39;);
        }

        return isValid;
    }

    // Validate entire form
    function validateForm() {
        const termsCheckbox = document.getElementById(&#39;terms-agreement&#39;);
        const checkoutBtn = document.getElementById(&#39;checkout-btn&#39;);
        
        let isFormValid = true;

        // Check terms agreement
        if (!termsCheckbox.checked) {
            isFormValid = false;
        }

        // Check required fields based on selected options
        const addressOption = document.querySelector(&#39;input[name="address-option"]:checked&#39;);
        if (addressOption &amp;&amp; addressOption.value === &#39;new&#39;) {
            const requiredFields = document.querySelectorAll(&#39;#new-address-form input[required], #new-address-form select[required]&#39;);
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    isFormValid = false;
                }
            });
        }

        // Check payment method fields
        const paymentMethod = document.querySelector(&#39;input[name="payment-method"]:checked&#39;);
        if (paymentMethod &amp;&amp; paymentMethod.value === &#39;credit-card&#39;) {
            const creditCardFields = document.querySelectorAll(&#39;#credit-card-form input&#39;);
            creditCardFields.forEach(field => {
                if (!validateField(field)) {
                    isFormValid = false;
                }
            });
        }

        // Update checkout button state
        checkoutBtn.disabled = !isFormValid;
        if (isFormValid) {
            checkoutBtn.classList.add(&#39;checkout-btn-enabled&#39;);
        } else {
            checkoutBtn.classList.remove(&#39;checkout-btn-enabled&#39;);
        }
    }

    // Handle checkout button click
    window.handleCheckout = function() {
        const checkoutBtn = document.getElementById(&#39;checkout-btn&#39;);
        
        if (checkoutBtn.disabled) {
            PagodaUtils.showToast(&#39;Vui lòng hoàn thành tất cả thông tin bắt buộc&#39;, &#39;warning&#39;);
            return;
        }

        // Show loading state
        checkoutBtn.disabled = true;
        checkoutBtn.innerHTML = `
            <span class="loading loading-spinner loading-sm"></span>
            Đang xử lý...
        `;

        // Simulate processing time
        setTimeout(() => {
            // Navigate to confirmation page
            navigateTo(&#39;payment_confirmation_page&#39;);
        }, 2000);
    };

    // Handle back navigation
    window.handleBackNavigation = function() {
        navigateTo(&#39;shop_product_detail_page&#39;);
    };

    // Add smooth scrolling for mobile
    function smoothScrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: &#39;smooth&#39;
        });
    }

    // Real-time form validation feedback
    function showFieldError(field, message) {
        // Remove existing error message
        const existingError = field.parentNode.querySelector(&#39;.field-error&#39;);
        if (existingError) {
            existingError.remove();
        }

        // Add new error message
        const errorDiv = document.createElement(&#39;div&#39;);
        errorDiv.className = &#39;field-error text-error text-xs mt-1&#39;;
        errorDiv.textContent = message;
        field.parentNode.appendChild(errorDiv);
    }

    // Initialize tooltips for payment security
    function initializeTooltips() {
        const securityElements = document.querySelectorAll(&#39;[data-tooltip]&#39;);
        securityElements.forEach(element => {
            element.addEventListener(&#39;mouseenter&#39;, function() {
                // Show tooltip implementation
            });
        });
    }

})();
