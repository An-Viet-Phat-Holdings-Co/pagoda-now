                function setIframeSize(w, h) {
                  const currentContainerRadio = w / h
                  let widthValue = w
                  let heightValue = h
                  let zoom = 1
                  if (currentContainerRadio > resolutionRatio) {
                    widthValue = h * resolutionRatio
                    heightValue = h
                  } else {
                    widthValue = w
                    heightValue = w / resolutionRatio
                  }
                  zoom = width ? widthValue / width : 1
                  return {
                    width: widthValue / zoom + 'px',
                    height: heightValue / zoom + 'px',
                    zoom,
                  }
                }
                function adjustIframeSize() {
                  const iframeWrapper = document.querySelector(".iframe-wrapper")
                  const { width, height, zoom } = setIframeSize(window.innerWidth, window.innerHeight)
                  iframeWrapper.style.height = height
                  iframeWrapper.style.width = width
                  iframeWrapper.style.transform = 'scale(' + zoom + ')'
                }
                function sanitizeFilename(name) {

                function handlePostMessage(event) {
                  if (!event.data) {

                  const targetPageName = pageNameMap[targetPageId]
                  if (type === "iframeNavigation" && targetPageId && targetPageName) {
                    window.location.href = targetPageName + '.html'
                  }
                }
                window.addEventListener('message', handlePostMessage)
                window.onload = adjustIframeSize
                window.onresize = adjustIframeSize
                window.onunload = () => {
                  window.removeEventListener('message', handlePostMessage)
                }

<script>
(function() {
    // Navbar specific functionality
    const navbar = document.querySelector(&#39;[data-section-id="navbar_web"]&#39;);

    // Close mobile menu when clicking outside
    document.addEventListener(&#39;click&#39;, function(event) {
        const mobileMenu = document.getElementById(&#39;mobile-menu&#39;);
        const menuToggle = navbar.querySelector(&#39;.btn-circle&#39;);
        
        if (mobileMenu &amp;&amp; !mobileMenu.contains(event.target) &amp;&amp; !menuToggle.contains(event.target)) {
            mobileMenu.classList.add(&#39;hidden&#39;);
        }
    });

    // Update active navigation state
    window.setActiveNavigation = function(pageId) {
        const navLinks = navbar.querySelectorAll(&#39;.menu a&#39;);
        navLinks.forEach(link => {
            link.classList.remove(&#39;text-primary&#39;, &#39;font-semibold&#39;);
        });

        // Map pageId to navigation items
        const navMap = {
            &#39;temples_list_page&#39;: &#39;Chùa&#39;,
            &#39;temple_detail_page&#39;: &#39;Chùa&#39;,
            &#39;temples_map_view_page&#39;: &#39;Chùa&#39;,

            &#39;charity_list_page&#39;: &#39;Từ thiện&#39;,
            &#39;charity_detail_page&#39;: &#39;Từ thiện&#39;
        };

        if (navMap[pageId]) {
            const activeLink = Array.from(navLinks).find(link => 
                link.textContent.trim() === navMap[pageId]
            );
            if (activeLink) {
                activeLink.classList.add(&#39;text-primary&#39;, &#39;font-semibold&#39;);
            }
        }
    };
})();

    <script>
function checkNotificationsState() {
    const notificationList = document.getElementById(&#39;NotificationList&#39;);
    const noNotificationsSection = document.getElementById(&#39;NoNotifications&#39;);
    const controlsSection = document.getElementById(&#39;NotificationControls&#39;);
    const hasNotifications = notificationList.querySelector(&#39;.notification-item&#39;) !== null;

    if (hasNotifications) {
        notificationList.classList.remove(&#39;hidden&#39;);
        controlsSection.classList.remove(&#39;hidden&#39;);
        noNotificationsSection.classList.add(&#39;hidden&#39;);
    } else {
        notificationList.classList.add(&#39;hidden&#39;);
        controlsSection.classList.add(&#39;hidden&#39;);
        noNotificationsSection.classList.remove(&#39;hidden&#39;);
    }
}

function markNotificationAsRead(element) {
    const item = element.closest(&#39;.notification-item&#39;);
    if (item &amp;&amp; item.classList.contains(&#39;unread&#39;)) {
        item.classList.remove(&#39;unread&#39;);
        // Visually change card style
        item.style.backgroundColor = &#39;rgba(255, 255, 255, 0.7)&#39;; 
        // Hide "Mark as Read" option and the new badge
        const markReadOption = item.querySelector(&#39;a[onclick*="markNotificationAsRead"]&#39;);
        if (markReadOption) {
            markReadOption.parentElement.style.display = &#39;none&#39;;
        }
        const unreadBadge = item.querySelector(&#39;.unread-badge&#39;);
        if (unreadBadge) {
            unreadBadge.style.opacity = &#39;0&#39;;
            setTimeout(() => unreadBadge.style.display = &#39;none&#39;, 300);
        }
    }
}

function deleteNotification(element) {
    const item = element.closest(&#39;.notification-item&#39;);
    if (item) {
        item.classList.add(&#39;deleting&#39;);
        setTimeout(() => {
            item.remove();
            checkNotificationsState();
        }, 300);
    }
}

function markAllAsRead() {
    const unreadItems = document.querySelectorAll(&#39;.notification-item.unread&#39;);
    unreadItems.forEach(item => {
        const markReadLink = item.querySelector(&#39;a[onclick*="markNotificationAsRead"]&#39;);
        if (markReadLink) {
            markNotificationAsRead(markReadLink);
        }
    });
}

function clearAllNotifications() {
     // Optional: Add a confirmation dialog for better UX
    if (confirm(&#39;Bạn có chắc chắn muốn xóa tất cả thông báo không?&#39;)) {
        const allItems = document.querySelectorAll(&#39;.notification-item&#39;);
        allItems.forEach(item => {
            item.classList.add(&#39;deleting&#39;);
        });
        setTimeout(() => {
            allItems.forEach(item => item.remove());
            checkNotificationsState();
        }, 300);
    }
}


document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
    if (window.setActiveNavigation) {
        window.setActiveNavigation(&#39;notifications_page&#39;);
    }

    // Initial check on page load
    checkNotificationsState();

    // Close dropdown when clicking outside
    document.addEventListener(&#39;click&#39;, function (event) {
        const openDropdowns = document.querySelectorAll(&#39;.dropdown.dropdown-open&#39;);
        openDropdowns.forEach(dropdown => {
            if (!dropdown.contains(event.target)) {
                 dropdown.removeAttribute(&#39;open&#39;);
            }
        });
    });

    // Make dropdowns work with details/summary polyfill for DaisyUI
    const dropdowns = document.querySelectorAll(&#39;.dropdown&#39;);
    dropdowns.forEach(dropdown => {
        const toggle = dropdown.querySelector(&#39;[tabindex="0"]&#39;);
        toggle.addEventListener(&#39;click&#39;, (e) => {
            if (dropdown.hasAttribute(&#39;open&#39;)) {
                dropdown.removeAttribute(&#39;open&#39;);
            } else {
                dropdown.setAttribute(&#39;open&#39;, &#39;&#39;);
            }
            e.stopPropagation();
        });
    });

});
</script>
